# ContextWeave — all tunable values and on/off flags live here.
# Threshold, budget and cost values start as placeholders; `make calibrate-costs`
# replaces costs with measured values and thresholds are tuned on validation queries only.

seed: 42

# Which collection to use. "cs" = our CS course-material corpus.
# Public test collections with human qrels: "scifact", "nfcorpus" (BEIR).
collection: cs

paths:
  raw: data/raw
  processed: data/processed
  indexes: indexes
  results: experiments/results
  benchmark: benchmark
  external: data/external

ingestion:
  min_page_chars: 300          # pages with less text are skipped
  header_footer_repeat: 0.4    # a line repeated on >= this share of pages is a header/footer
  min_doc_chars: 1500          # documents with less text are rejected and logged

chunking: {max_tokens: 200, overlap: 40}
text: {lowercase: true, stopwords: english, stemmer: porter}

indexing:
  block_size: 2000             # passages per block before a merge (blocked index construction)

bm25: {k1: 1.2, b: 0.75}
champion: {r: 50}                        # postings kept per term
index_elimination: {idf_threshold: 1.5, min_terms_matched: 2}

dense:
  model: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 64
  max_seq_length: 256

expansion:
  enabled: true
  max_terms: 5
  weight: 0.3
  feedback_docs: 5             # top results used as pseudo-relevance feedback
  candidate_terms: 30          # high TF-IDF terms considered before the embedding filter
  min_similarity: 0.25         # term must be at least this close to the query (cosine)

fusion: {method: weighted, normalisation: minmax}

retrieval:
  k: 10                        # results returned
  depth: 100                   # list depth each method retrieves (for fusion / metrics)

controller:
  tau: 0.60                    # confidence threshold, tuned on validation queries
  budget: 3.0                  # cost units per query
  ladder_lexical: [bm25_champion, bm25, dense, expansion]
  ladder_semantic: [dense, bm25, expansion]
  router:
    short_max_terms: 4
    long_min_terms: 8
    high_idf: 3.0              # mean IDF at/above this counts as "high IDF"
    unknown_share: 0.5         # share of unknown terms that counts as "many"
  confidence_weights:          # hand-set starting weights; sigmoid(bias + sum w_i * s_i)
    bias: -2.0
    margin: 2.0
    coverage: 2.5
    concentration: 0.5
    agreement: 2.0
  alpha:                       # fusion weight of the lexical part, alpha(q)
    default: 0.5
    exact: 0.7                 # quotes / formula tokens / short high-IDF queries
    semantic: 0.3              # questions, long queries, many unknown terms

costs: {bm25_champion: 0.3, bm25: 1.0, tfidf: 1.0, dense: 2.0, expansion: 1.0, boolean: 0.2}

# ---------------------------------------------------------------------------
# Novel extensions (ContextWeave+). All OFF by default so the baseline
# controller is exactly the specification. Experiments switch them on.
# ---------------------------------------------------------------------------
features:
  qpp_signals: false           # add query-performance-prediction signals (NQC, WIG) to confidence
  voc_policy: false            # value-of-computation escalation instead of the fixed ladder
  risk_controlled_tau: false   # use the tau chosen by Learn-then-Test risk control
  qpp_fusion: false            # set alpha(q) from the two lists' QPP instead of rules only

novelty:
  qpp:
    nqc_weight: 1.5
    wig_weight: 1.0
  voc:
    lambda: 0.01               # stop when best expected gain per cost unit falls below this
    confidence_bins: [0.0, 0.3, 0.5, 0.7, 1.01]
    prior_strength: 3.0        # shrinkage of per-bin gain estimates toward the action mean
    model_file: voc_gain_model.json
  risk:
    epsilon: 0.05              # a query "fails" if its NDCG@10 is > epsilon below fixed hybrid
    delta: 0.15                # allowed failure rate
    eta: 0.10                  # 1 - eta = confidence of the guarantee
    tau_grid: [0.95, 0.9, 0.85, 0.8, 0.75, 0.7, 0.65, 0.6, 0.55, 0.5, 0.45, 0.4, 0.35, 0.3]
    model_file: risk_tau.json
  qpp_fusion:
    mix: 0.5                   # alpha = mix * rule_alpha + (1 - mix) * qpp_alpha
